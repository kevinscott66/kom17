; Alembic config — single env.py drives all five SQLite databases.
; Pick the target with ``alembic -x db=<name> <command>``, e.g.:
;   alembic -x db=users current
;   alembic -x db=economy upgrade head
;   alembic -x db=users revision --autogenerate -m "add user.foo"
;
; Each DB has its own ``versions/<name>/`` directory and its own
; ``alembic_version`` table inside the SQLite file — they never mix.

[alembic]
script_location = migrations
prepend_sys_path = . src
version_path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///database/_alembic_placeholder.db
; ^ overridden in env.py from pydantic-settings; this value is only here
;   because alembic refuses to start without one.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
