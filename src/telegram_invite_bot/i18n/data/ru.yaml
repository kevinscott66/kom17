# Plain text only: these land in HTML and are escaped at the boundary,
# so Telegram markup here would show up as literal <b> on the page.
site_page_title: "Команды бота — справочник"
site_subtitle: "справочник и гайд"
# Подзаголовок первого экрана. Обещает ровно то, что на странице есть,
# и в том же порядке: сначала список команд, потом гайд по экономике.
site_lede: "Все команды бота с описаниями — и подробный гайд по экономике: монеты, пополнение, вывод, игры и покупки."
site_lang_nav: "Язык страницы"
site_open_bot: "Открыть бота в Telegram"
site_search_label: "Поиск по командам"
# Два примера, а не три: поле набрано моноширинным, и на экране 375 px
# третий пример обрезался посреди слова — подсказка выглядела сломанной.
site_search_placeholder: "Найти команду: баланс, ставка…"
site_search_clear: "Очистить поиск"
site_search_empty: "Ничего не нашлось. Попробуйте другое слово — поиск смотрит и на название команды, и на описание, и на слова без слэша."
site_commands_heading: "Все команды"
site_commands_sub: "Нажмите на команду, чтобы скопировать её и вставить в чат с ботом. Под каждой командой серым — слова, которыми её можно вызвать без слэша."
# ── Панель «без слэша» над списком команд.
# Половина бота вызывается обычными словами («баланс», «кто я»,
# «погода Казань»), и именно так им пользуются каждый день. Список из
# одних слэш-команд эту половину прячет, поэтому правило написано один
# раз здесь, а сами слова печатаются из таблицы мидлвари.
site_plain_heading: "Без слэша"
site_plain_row_label: "без слэша:"
site_subcmd_row_label: "отдельные команды:"
