faq_footer: '---

  ❓ **Остались вопросы?**

  👉 /support — обращение в поддержку

  👉 /feedback — идеи и сообщения о сбоях

  👉 Обратись к администрации чата.'
faq_part1: '

  🤔 **НАЧАЛО РАБОТЫ**


  **Как начать пользоваться ботом?**

  Напиши боту /start в личке или добавь его в группу. Регистрация не нужна — достаточно нажать /start.


  **Какие команды основные?**

  /help — полный список команд. Кратко: /balance — баланс, /daily — бонус раз в день, /shop — магазин, /faq — этот раздел.


  **Как сменить язык?**

  Команда /lang — откроется выбор языка (русский / English).


  👥 **ГРУППЫ**


  **Как добавить бота в группу?**

  В личке с ботом: меню или /start → кнопка «Добавить в свою группу». Выбери группу, добавь бота, затем сделай его **администратором**.


  **Какие права нужны боту?**

  Удаление сообщений, добавление участников (инвайт-ссылки). По желанию — закрепление сообщений.


  **Как настроить группу?**

  В группе: команда /groupadmin — откроется панель управления (модерация, настройки, статистика).


  **Как стать админом группы?**

  Ранги и права назначает владелец группы в панели /groupadmin → раздел «Персонал (Staff)».


  **Как управлять модераторами?**

  /groupadmin → «Персонал»: добавление и снятие модераторов, назначение рангов.


  🛡 **МОДЕРАЦИЯ**


  **Как забанить пользователя?**

  Ответь на сообщение нарушителя: `/ban [часы] [причина]`

  Пример: `/ban 168 спам` — бан на неделю. `/ban` без числа — навсегда. Нужны права администратора.


  **Как выдать предупреждение?**

  Ответь на сообщение: `/warn [срок] [причина]`

  Пример: `/warn 7d спам в чате` — предупреждение на неделю. Без срока — 30 дней, `/warn 0` — бессрочно.


  **Сколько варнов до бана?**

  По умолчанию 3 предупреждения — затем автоматический бан (если включено в настройках группы). Точное число смотри в /groupadmin.


  **Как снять бан или мут?**

  Ответь на сообщение пользователя: /unban — снять бан, /unmute — снять мут. Нужны соответствующие права.


  **Можно ли указать причину?**

  Да. Для /warn: `/warn [срок] причина`. Для /mute и /ban: причина после времени, например `/mute 2 спам`.


  **Почему меня забанили?**

  Решение принимает администрация группы (нарушение правил, варны и т.д.). Уточнить причину можно у админов чата или через /support.


  💰 **ВАЛЮТА И МАГАЗИН**


  **Как получить монеты?**

  • Сообщения в чат (+1 за сообщение)

  • Ежедневный бонус: /daily

  • Игры (рулетка, кости, дуэли) — за победы

  • Конкурсы от админов


  **Как проверить баланс?**

  Команда /balance (или /bal) — в личке или в группе.


  **Что можно купить?**

  В магазине (/shop, в личке): цветной ник, VIP, снятие предупреждения и др.


  **Как купить VIP?**

  Открой /shop в личке с ботом, выбери товар «VIP» и нажми кнопку покупки.

  '
faq_part2: '

  🎮 **ИГРЫ**


  **В какие игры можно играть?**

  /roulette [ставка] — рулетка (6 камор, 3 патрона — шанс выиграть 50%; при победе ×1.89; антиабуз: кулдаун, лимит в час и в сутки). /dice [ставка] [1–6] — кости (угадал число — ×5.7). /duel [ставка] [побед] — ответом на сообщение: дуэль кубиками.


  **Как играть в дуэли?**

  Ответь на сообщение соперника: /duel 100 3 — ставка 100 монет, победа до 3 побед. Соперник принимает вызов — кидаете кубики, кто первым наберёт N побед, забирает ставку.


  **Начисляются ли монеты за игры?**

  Да: за победы в рулетке, костях и дуэлях. За проигрыш ставка списывается.


  **Есть ли рейтинг?**

  Топы: /top balance, /top games, /top wins. Статистика дуэлей: /duel_stats.


  📊 **СТАТИСТИКА**


  **Как посмотреть свою статистику?**

  /stats — краткая статистика. /profile — подробный профиль (достижения, история).


  **Как посмотреть статистику группы?**

  В группе: /chatstats или /chatinfo — активность, топ участников.


  **Что показывает статистика?**

  Сообщения, игры, заработок/траты, серии (streak), достижения.


  **Можно ли сбросить статистику?**

  Нет, сброс статистики пользователя не предусмотрен.


  🆘 **ПОДДЕРЖКА**


  **Как связаться с поддержкой?**

  Команда /support — откроется форма обращения. Ответ придёт в личку.


  **Как сообщить о проблеме?**

  /support — опиши проблему в форме. Или /feedback — для сбоев и предложений по работе бота.


  **Как предложить идею?**

  Команда /feedback — отправь описание идеи или улучшения.


  📢 **РЕКЛАМОДАТЕЛЯМ**


  **Как разместить рекламу?**

  Команда /ad (или кнопка «Заявка на рекламу» в меню) — заполни заявку. С тобой свяжутся.


  **Сколько стоит? Какая аудитория?**

  Уточняй в заявке через /ad — условия и аудиторию подскажет администрация.


  🤖 **ИИ-ПОМОЩНИК**


  **Как спросить у ИИ?**

  В чате: напиши «ком вопрос» или «ии вопрос». Или команда /ai — откроется режим помощника. Пример: «ком как играть в дуэль»

  '
