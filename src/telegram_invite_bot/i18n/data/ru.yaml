# Stage 22: /faq2 standalone — pure static text, no callbacks/DB/AI.
# RR-6 #70 later added the sibling part-1 keys above and the Telegraph
# button below, so /faq is now fully owned by the new pipeline. The body
# concatenates legacy faq_part2 + faq_footer (translations.py:1085+1086)
# converted from Markdown bold to HTML <b> (bot is parse_mode=HTML).
h_faq_part2: |-

  🎮 <b>ИГРЫ И ЧЕСТНОСТЬ</b>

  <b>Игры честные?</b>
  Исход случайный и не зависит ни от размера ставки, ни от баланса, ни от того, сколько ты уже проиграл. Но перевес заведения есть, и он не скрыт: в рулетке шанс 50%, а выплата ×1.89; в костях шанс 1 из 6, выплата ×5.7. В дуэлях и «камень-ножницы-бумага» с банка удерживается 5%.

  <b>Что это значит на практике?</b>
  Что на длинной дистанции игра убыточна — так устроена любая игра со ставками. Короткая серия может дать плюс, длинная почти наверняка даст минус. Ставь только то, что не жалко потерять.

  <b>Можно отыграться?</b>
  Нет стратегии, которая переигрывает перевес заведения: удвоение ставки после проигрыша упирается в лимит быстрее, чем в удачу. Если ловишь себя на желании отыграться — лучший ход закрыть бота.

  <b>Почему игра не запускается?</b>
  Между играми есть кулдаун, а также лимиты в час и в сутки и потолок ставки. Это и защита от накрутки, и стоп-кран на импульсивную серию.

  👑 <b>VIP И ПОКУПКИ</b>

  <b>Что даёт VIP?</b>
  Поднятые дневные лимиты на ИИ и расшифровку голосовых, косметику и бонусы к начислениям. Точный состав тарифа виден на карточке перед покупкой — сравни, прежде чем платить.

  <b>Куда девается купленное?</b>
  В инвентарь. Разовые предметы (например, снятие предупреждения) лежат там до применения, VIP действует до конца оплаченного срока и не продлевается автоматически.

  <b>Покупка за монеты и оплата деньгами — это одно и то же?</b>
  Нет. Внутри бота всё покупается за монеты. Реальные деньги нужны только чтобы получить сами монеты.

  👥 <b>ГРУППЫ И ПРАВА</b>

  <b>Какие права нужны боту?</b>
  Удаление сообщений и приглашение участников — без них не работают ни модерация, ни инвайт-ссылки. Закрепление сообщений — по желанию.

  <b>Кто может пользоваться командами модератора?</b>
  Только те, кому администратор выдал права в панели группы. Любую команду можно выключить отдельно для конкретного чата — удобно, если группа нужна без игр или без ИИ.

  <b>Меня наказали — это решил бот?</b>
  Нет. Баны, муты и предупреждения выдают администраторы чата, бот их исполняет. Сам он срабатывает только по правилам, которые включила администрация группы (например, порог предупреждений). Разбираться нужно с админами чата, а не с ботом.

  🔒 <b>ПРИВАТНОСТЬ</b>

  <b>Что бот хранит?</b>
  Telegram ID, ник и язык, баланс и историю операций, счётчики активности (сколько сообщений, а не какие) и текст обращений в поддержку. Содержимое обычных сообщений в чате не сохраняется.

  <b>Куда уходят запросы к ИИ и голосовые?</b>
  Во внешние сервисы — иначе распознать речь и ответить невозможно. Не отправляй боту то, что не готов доверить третьей стороне: пароли, документы, чужие персональные данные.

  <b>Можно удалить свои данные?</b>
  Да, через /support. Учти: удаление аккаунта обнуляет баланс и покупки, восстановить их будет нельзя.

  🆘 <b>ПОДДЕРЖКА</b>

  <b>Команда не работает — что проверить?</b>
  1) Где ты её вызываешь: часть команд работает только в личке. 2) Не выключена ли она в этой группе. 3) Выданы ли боту права администратора. Если всё так, а ответа нет — это баг, и его стоит прислать.

  <b>Как написать?</b>
  /support — форма обращения, ответ приходит в личку. Укажи время, чат и что ожидал увидеть: с этим разбор занимает минуты, без этого — дни.

  <b>Нашёл ошибку или есть идея?</b>
  /feedback — сбои и предложения по работе бота. Идеи читают, часть из них доезжает до релиза.

  📢 <b>РЕКЛАМА</b>

  <b>Как разместить рекламу?</b>
  /ad — заявка. Условия, охват и цену подскажет администрация в ответе.

  🤖 <b>ИИ-ПОМОЩНИК</b>

  <b>Как спросить у ИИ?</b>
  В чате: напиши «ком вопрос» или «ии вопрос». Или команда /ai — откроется режим помощника. Пример: «ком как играть в дуэль»


  ---
  ❓ <b>Остались вопросы?</b>
