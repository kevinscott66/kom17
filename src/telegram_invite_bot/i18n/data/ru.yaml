# /faq part 1 — title + table of contents + the first four sections.
# Markdown ``**`` → HTML <b> because the bot's parse_mode is HTML
# process-wide.
#
# T-041 REWROTE the body. Both the legacy copy and its RR-6 #70 port
# were a command catalog in prose: "/balance — баланс, /daily — бонус…".
# That answer now lives on the public site (``/commands``), which is
# generated from ``core.ranks.COMMAND_ENTRIES`` and therefore cannot go
# stale, and the button under this card goes straight there. Duplicating
# it here bought nothing and drifted every time a command was renamed.
#
# What replaces it is what a command list structurally cannot answer:
# why the coins stopped arriving (the 150/day cap), why a withdrawal is
# refused (deposit gate + lifetime-payout cap), what the games actually
# pay (×1.89 at 50%, ×5.7 at 1/6, 5% rake), and what the bot stores.
#
# EVERY NUMBER BELOW IS LOAD-BEARING and mirrors a default in
# ``config/settings.py`` — message_reward_daily_cap (150),
# coins_message_reward (1), message_reward_min_chars (8),
# message_reward_cooldown_sec (20), WithdrawConfig.min_coins (4500),
# max_coins (90 000), daily_limit_coins (10 000), monthly_limit_coins
# (100 000), require_deposit (True), payout_ratio (1.0), and
# ``rates.COINS_PER_USD`` (900). Change a default → change the copy, in
# BOTH languages, or the bot starts lying to paying users about limits.
#
# The four part-1 sections match the first four entries of h_faq_toc;
# the remaining five live in h_faq_part2. Keep both halves in sync with
# the TOC when editing, or the contents line starts lying.
h_faq_title: "❓ <b>ЧАСТО ЗАДАВАЕМЫЕ ВОПРОСЫ</b>"
h_faq_toc: "📌 <b>Оглавление:</b> Начало · Монеты · Пополнение · Вывод · Игры · VIP · Группы · Приватность · Поддержка · Реклама · ИИ"
h_faq_part1: |-

  🚀 <b>НАЧАЛО</b>

  <b>Что это за бот?</b>
  Бот для групп: внутренняя валюта DLAB, игры, магазин, модерация и статистика чата. В личке — настройки и кошелёк, в группе — всё остальное.

  <b>С чего начать?</b>
  Напиши /start в личке — регистрация не нужна, аккаунт заводится сам. Полный список команд с описаниями открывается кнопкой под этим сообщением.

  <b>Бот не отвечает в группе. Что делать?</b>
  Чаще всего ему не выдали права администратора: без них он не видит обычные сообщения и не может ни удалять, ни приглашать. Второй случай — команда отключена именно для этой группы. И то и другое решает администратор чата.

  💰 <b>МОНЕТЫ (DLAB)</b>

  <b>Откуда берутся монеты?</b>
  Активность в чате, ежедневный бонус, победы в играх, промокоды, рефералы и пополнение. За сообщение — 1 DLAB: от 8 символов, не чаще раза в 20 секунд и не больше 150 DLAB в сутки. Повтор одного и того же текста не считается.

  <b>Почему монеты за сообщения перестали приходить?</b>
  Скорее всего упёрся в дневной потолок 150 DLAB — он сбрасывается на следующие сутки. Это защита от накрутки, а не наказание.

  <b>Сколько стоит монета?</b>
  900 DLAB = 1 USDT, и это один и тот же курс на входе и на выходе. Спреда нет: бот не зарабатывает на обмене.

  <b>Что даёт реферальная ссылка?</b>
  10% от пополнений приглашённых — от денег, которые они реально внесли. С покупок за монеты комиссия не начисляется, поэтому «прокрутить» её по кругу не выйдет.

  💳 <b>ПОПОЛНЕНИЕ</b>

  <b>Как пополнить баланс?</b>
  Карта, СБП или криптовалюта — способ выбирается в разделе пополнения. Сумма пересчитывается по актуальному курсу в момент оплаты.

  <b>Оплатил, а монеты не пришли.</b>
  Подожди 2–3 минуты: зачисление идёт по подтверждению от платёжной системы, а не по факту нажатия «Оплатить». Если не пришло — напиши в /support и укажи время платежа и сумму. Платёж привязан к твоему ID и не теряется.

  <b>Можно вернуть пополнение?</b>
  Монеты — внутренняя валюта, автоматического возврата нет. Спорные случаи разбираются вручную через /support.

  🏦 <b>ВЫВОД</b>

  <b>Кто может выводить?</b>
  Те, кто хотя бы раз пополнял баланс. И суммарно вывести можно не больше, чем суммарно внесено. Это не жадность: иначе бесплатные монеты за активность превращались бы в реальные деньги, и экономика бота жила бы недолго.

  <b>Какие лимиты?</b>
  От 4 500 до 90 000 DLAB за одну заявку, до 10 000 DLAB в сутки и до 100 000 DLAB в месяц.

  <b>Сколько ждать?</b>
  Заявки подтверждаются вручную, поэтому не мгновенно. Результат приходит в личку в обоих случаях — и при одобрении, и при отказе.

  👇 <b>Дальше:</b> игры и честность, VIP, группы, приватность и поддержка.

