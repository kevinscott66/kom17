# #122: ответ группоспецифичной команды, набранной в личке. Подставляется
# тот алиас, который человек реально написал (см. handlers/group_only.py),
# поэтому строка одна на все семейства команд.
h_group_only_command: "❌ Команда /{command} работает только в группе. Добавь бота в групповой чат и набери её там."
# #123: зеркало предыдущей строки — команда для лички, набранная в группе.
# К ответу прикладывается кнопка на диалог с ботом: знать, что «нужно в
# личку», мало, туда ещё надо попасть.
h_private_only_command: "❌ Команда /{command} работает только в личке с ботом. Открой диалог кнопкой ниже и набери её там."
h_private_only_btn: ✉️ Открыть личку с ботом
# #158: команда наша, но форма аргументов не подошла ни одному хендлеру.
# До удаления легаси такой вызов проваливался туда и получал подсказку по
# синтаксису; теперь проваливаться некуда, и без этой строки человек не
# получал вообще ничего. Описание — та же строка h_cmd_<key>, что видна в
# /help, чтобы «что это за команда» и «как её писать» звучали одинаково.
h_unknown_form: "🤔 <b>/{command}</b> — {description}\n\nТакую форму я не понял. Проверь аргументы или загляни в /help — там вся команда одной строкой."
# #159: тап по кнопке, под которой не осталось обработчика — карточка
# из старого деплоя, сброшенное состояние диалога, клавиатура месячной
# давности. Без этой строки Telegram крутит спиннер ~15 секунд и гасит
# его молча. Всплывашка, а не алерт: карточка просто устарела. Про саму
# кнопку не говорим ни слова — payload наружу не показываем.
h_stale_card: "⌛ Эта карточка устарела — открой её заново командой."
