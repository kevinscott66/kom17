site_commands_sub: "Tap a command to copy it, then paste it into your chat with the bot. The grey line under each one lists the words that call it without a slash."
# ── The "no slash" panel above the index.
# Half the bot answers to ordinary words — balance, "кто я", "погода
# Казань" — and that is how people actually use it day to day. A
# slash-only list hides that half, so the rule is stated once here and
# the trigger words themselves are printed from the middleware's own
# table. Only the prose lives in this file: the tokens a user types are
# data, identical in both languages, which is also why these values
# stay free of Cyrillic.
site_plain_heading: "Without a slash"
site_plain_row_label: "no slash:"
site_subcmd_row_label: "separate commands:"
site_plain_private: "In a DM with the bot the slash is optional — the bare word is enough:"
site_plain_private_ex: "balance"
site_plain_group: "In a group the word needs one of these in front:"
site_plain_group_ex: ".weather Kazan"
site_plain_bare: "Only these phrases work with nothing in front, in a group:"
site_plain_weather: "The weather can be asked as a whole sentence:"
site_plain_weather_ex: "what's the weather in Kazan tomorrow"
# Rendered after the AI marker, as «ком, <this>» — the marker itself
# comes from the code, so the question is all that needs translating.
