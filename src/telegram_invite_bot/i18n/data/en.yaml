# Stage 22: /faq2 standalone. See ru.yaml for the why.
h_faq_part2: |-

  🎮 <b>GAMES AND FAIRNESS</b>

  <b>Are the games fair?</b>
  The outcome is random — it does not depend on your bet, your balance or how much you have already lost. But the house edge is real and not hidden: roulette is a 50% chance paying ×1.89; dice is 1 in 6 paying ×5.7. Duels and rock-paper-scissors take 5% off the pot.

  <b>What does that mean in practice?</b>
  That the games lose money over a long run — that is how every stake game works. A short streak can go your way; a long one almost certainly will not. Only stake what you can afford to lose.

  <b>Can I win it back?</b>
  No strategy beats the house edge: doubling after a loss hits the bet ceiling long before it hits luck. If you catch yourself chasing losses, the best move is to close the bot.

  <b>Why won't a game start?</b>
  There is a cooldown between games, plus hourly and daily limits and a maximum bet — anti-farming, and a brake on an impulsive streak.

  👑 <b>VIP AND PURCHASES</b>

  <b>What does VIP give me?</b>
  Higher daily limits for the AI and voice transcription, cosmetics, and bonuses on what you earn. Each plan lists its exact contents on its card before you pay.

  <b>Where do my purchases go?</b>
  Into your inventory. One-shot items sit there until used; VIP runs to the end of the paid period and does not auto-renew.

  <b>Is buying with coins the same as paying money?</b>
  No. Everything inside the bot is bought with coins. Real money is only ever needed to obtain the coins themselves.

  👥 <b>GROUPS AND PERMISSIONS</b>

  <b>What permissions does the bot need?</b>
  Delete messages and add members — without them neither moderation nor invite links work. Pinning is optional.

  <b>Who can use moderator commands?</b>
  Only the people an admin granted rights to in the group panel. Any command can be switched off for one specific chat — handy if you want the group without games, or without the AI.

  <b>I was punished — was that the bot?</b>
  No. Bans, mutes and warnings are issued by chat administrators; the bot carries them out, and acts on its own only under rules those admins enabled (a warning threshold, for example). Take it up with the chat admins.

  🔒 <b>PRIVACY</b>

  <b>What does the bot store?</b>
  Your Telegram ID, name and language, your balance and transaction history, activity counters (how many messages, not which ones) and the text of support tickets. The contents of ordinary chat messages are not stored.

  <b>Where do AI requests and voice messages go?</b>
  To external services — speech cannot be transcribed or answered otherwise. Don't send the bot anything you wouldn't hand to a third party: passwords, documents, other people's personal data.

  <b>Can I have my data deleted?</b>
  Yes, via /support. Note that deleting the account zeroes your balance and purchases, and they cannot be restored.

  🆘 <b>SUPPORT</b>

  <b>A command does nothing — what should I check?</b>
  1) Where you're using it: some commands are private-chat only. 2) Whether it is switched off in that group. 3) Whether the bot has admin rights. If all three are fine and there is still no reply, that's a bug worth reporting.

  <b>How do I write in?</b>
  /support opens a ticket form; the reply arrives in private. Include the time, the chat and what you expected — that turns a case from days into minutes.

  <b>Found a bug, or have an idea?</b>
  /feedback — bugs and suggestions. Ideas do get read, and some of them ship.

  📢 <b>ADVERTISING</b>

  <b>How do I place an ad?</b>
  /ad opens a request form. Terms, reach and pricing come back in the reply.

  🤖 <b>AI HELPER (KOM)</b>

  <b>How do I ask the AI?</b>
  In chat: type "kom question" or "ai, question". Or use /ai — opens the helper mode. Example: "kom how to play duel"


