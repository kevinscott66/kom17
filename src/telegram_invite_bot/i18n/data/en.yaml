faq_footer: '---

  ❓ **Still have questions?**

  👉 /support — contact support

  👉 /feedback — ideas and bug reports

  👉 Ask the chat administrators.'
faq_part1: '

  🤔 **GETTING STARTED**


  **How do I start using the bot?**

  Send /start to the bot in private chat or add it to a group. No sign-up needed — just press /start.


  **What are the main commands?**

  /help — full command list. Quick: /balance — balance, /daily — daily bonus, /shop — shop, /faq — this section.


  **How do I change the language?**

  Use /lang — you''ll get a language selector (Russian / English).


  👥 **GROUPS**


  **How do I add the bot to a group?**

  In private chat: menu or /start → «Add to my group». Choose the group, add the bot, then make it an **administrator**.


  **What permissions does the bot need?**

  Delete messages, add members (invite links). Optionally — pin messages.


  **How do I configure the group?**

  In the group: /groupadmin — opens the management panel (moderation, settings, stats).


  **How do I become a group admin?**

  The group owner assigns ranks in /groupadmin → «Staff» section.


  **How do I manage moderators?**

  /groupadmin → «Staff»: add/remove moderators and set ranks.


  🛡 **MODERATION**


  **How do I ban a user?**

  Reply to their message: `/ban [hours] [reason]`

  Example: `/ban 168 spam` — 1 week. `/ban` with no number — permanent. Requires admin rights.


  **How do I warn a user?**

  Reply to their message: `/warn [duration] [reason]`

  Example: `/warn 7d spam in chat` — a warning that lapses in a week. No duration — 30 days, `/warn 0` — never expires.


  **How many warnings before a ban?**

  By default 3 warnings — then auto-ban (if enabled in group settings). Check /groupadmin for the exact number.


  **How do I unban or unmute?**

  Reply to the user''s message: /unban — remove ban, /unmute — remove mute. Requires the right permissions.


  **Can I specify a reason?**

  Yes. For /warn: `/warn [duration] reason`. For /mute and /ban: reason after the duration, e.g. `/mute 2 spam`.


  **Why was I banned?**

  The group administration decides (rule break, warnings, etc.). Ask the chat admins or use /support to clarify.


  💰 **COINS & SHOP**


  **How do I get coins?**

  • Messages in chat (+1 per message)

  • Daily bonus: /daily

  • Games (roulette, dice, duels) — for wins

  • Admin-run contests


  **How do I check my balance?**

  Command /balance (or /bal) — in private or in a group.


  **What can I buy?**

  In the shop (/shop, in private): colored nickname, VIP, remove warning, etc.


  **How do I buy VIP?**

  Open /shop in private chat with the bot, select the «VIP» item and press the purchase button.

  '
faq_part2: '

  🎮 **GAMES**


  **What games can I play?**

  /roulette [bet] — roulette (6 chambers, 3 bullets — 50% win chance; ×1.89 if win; anti-abuse: cooldown, hourly and daily limits). /dice [bet] [1–6] — dice (guess the number — ×5.7). /duel [bet] [wins] — reply to a message: dice duel.


  **How do I play duels?**

  Reply to your opponent''s message: /duel 100 3 — bet 100 coins, first to 3 wins. They accept — you roll dice; first to N wins takes the pot.


  **Do I earn coins from games?**

  Yes: for wins in roulette, dice and duels. Losing deducts your bet.


  **Is there a ranking?**

  Leaderboards: /top balance, /top games, /top wins. Duel stats: /duel_stats.


  📊 **STATISTICS**


  **How do I see my stats?**

  /stats — short stats. /profile — full profile (achievements, history).


  **How do I see group stats?**

  In the group: /chatstats or /chatinfo — activity, top members.


  **What do stats show?**

  Messages, games, earned/spent, streaks, achievements.


  **Can I reset my stats?**

  No, user stats cannot be reset.


  🆘 **SUPPORT**


  **How do I contact support?**

  Command /support — opens a form. You''ll get a reply in private.


  **How do I report a problem?**

  /support — describe the issue in the form. Or /feedback — for bugs and suggestions.


  **How do I suggest an idea?**

  Command /feedback — send your idea or improvement.


  📢 **ADVERTISERS**


  **How do I place an ad?**

  Command /ad (or «Ad request» in the menu) — fill in the form. You''ll be contacted.


  **How much does it cost? What''s the audience?**

  Ask in the form via /ad — the team will provide terms and audience info.


  🤖 **AI HELPER (KOM)**


  **How do I ask the AI?**

  In chat: type "kom question" or "ai question". Or use /ai — opens the helper mode. Example: "kom how to play duel"

  '
