# #122: what a group-only command answers when typed in a private chat.
# The alias the user actually typed is substituted in (see
# handlers/group_only.py), so one line serves every command family.
h_group_only_command: "❌ /{command} only works in a group. Add the bot to a group chat and run it there."
# #123: the mirror of the line above — a DM-only command typed in a
# group. It carries a deep-link button: knowing you need a private chat
# is not the same as being in one.
h_private_only_command: "❌ /{command} only works in a private chat with the bot. Open one with the button below and run it there."
h_private_only_btn: ✉️ Open private chat
# #158: the command is ours, but the argument form matched no handler.
# Before legacy was removed such a call fell through to it and got a
# syntax hint back; there is nowhere left to fall, and without this line
# the user got nothing at all. The description is the same h_cmd_<key>
# line ``/help`` shows, so "what is this command" and "how do I write
# it" never say two different things.
h_unknown_form: "🤔 <b>/{command}</b> — {description}\n\nI did not understand that form. Check the arguments, or see /help — the whole command is one line there."
# #159: a tap on a button with no handler left behind it — a card from
# an older deploy, a dropped dialog state, a keyboard from last month.
# Without this line Telegram spins the button for ~15s and clears it
# silently. A toast, not an alert: the card is merely old. Says nothing
# about the button itself — the payload never reaches the user.
h_stale_card: "⌛ This card is out of date — open it again with the command."
# #1344: stands in for a name when the user has neither first_name
# nor username. It used to be a hardcoded Russian literal in
# handlers/group_events.py, which leaked into the English welcome and
# farewell lines as "Hi, друг!". The key lives here because it is
# substituted into h_group_welcome_member and left_chat, both of
# which are already picked by language.
