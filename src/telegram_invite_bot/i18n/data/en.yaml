# /faq part 1. See ru.yaml for the why — including the T-041 note on
# why the command catalogue moved to the site and which settings.py
# defaults every number below mirrors. Both languages must change
# together when a default changes.
h_faq_title: "❓ <b>FREQUENTLY ASKED QUESTIONS</b>"
h_faq_toc: "📌 <b>Contents:</b> Start · Coins · Top-up · Withdrawal · Games · VIP · Groups · Privacy · Support · Ads · AI"
h_faq_part1: |-

  🚀 <b>GETTING STARTED</b>

  <b>What is this bot?</b>
  A bot for groups: the DLAB currency, games, a shop, moderation and chat stats. Private chat holds your settings and wallet; everything else happens in the group.

  <b>How do I start?</b>
  Send /start in private chat — no sign-up, your account is created for you. The full command list with descriptions opens from the button under this message.

  <b>The bot ignores me in a group. Why?</b>
  Usually it was never granted administrator rights: without them it cannot see ordinary messages, delete anything or invite anyone. The other common case is that the command is switched off for that specific group. Both are fixed by a chat admin.

  💰 <b>COINS (DLAB)</b>

  <b>Where do coins come from?</b>
  Chat activity, the daily bonus, game wins, promo codes, referrals and top-ups. A message pays 1 DLAB: at least 8 characters, at most one reward per 20 seconds, and no more than 150 DLAB a day. Repeating the same text does not count.

  <b>Why did my messages stop paying?</b>
  You most likely hit the 150 DLAB daily cap. It resets the next day. That is anti-farming, not a punishment.

  <b>What is a coin worth?</b>
  900 DLAB = 1 USDT, the same rate going in and coming out. There is no spread — the bot does not make money on the exchange.

  <b>What does my referral link give me?</b>
  10% of what the people you invite top up — real money they actually paid in. Purchases made with coins pay no commission, so the loop cannot be farmed.

  💳 <b>TOP-UP</b>

  <b>How do I add coins?</b>
  Card, SBP or crypto — pick the method on the top-up screen. The amount is converted at the live rate at the moment you pay.

  <b>I paid and nothing arrived.</b>
  Give it 2–3 minutes: coins are credited when the payment provider confirms, not when you tap "Pay". If it still hasn't landed, write to /support with the time and amount. The payment is tied to your ID and does not get lost.

  <b>Can I get a refund?</b>
  Coins are in-bot currency, so there is no automatic refund. Disputes are handled manually via /support.

  🏦 <b>WITHDRAWAL</b>

  <b>Who can withdraw?</b>
  Anyone who has topped up at least once. And you can withdraw no more in total than you have paid in. That is not greed: otherwise free activity coins would turn into real money and the bot's economy would not last a month.

  <b>What are the limits?</b>
  4,500 to 90,000 DLAB per request, up to 10,000 DLAB a day and up to 100,000 DLAB a month.

  <b>How long does it take?</b>
  Requests are approved by hand, so not instantly. You get the outcome in private either way — approved or rejected.

  👇 <b>Coming next:</b> games and fairness, VIP, groups, privacy and support.

