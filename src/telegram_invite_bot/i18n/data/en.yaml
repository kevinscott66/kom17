# Two examples, not three: the field is monospaced, and on a 375px
# screen the third one clipped mid-word — a hint that looks broken.
site_search_placeholder: "Find a command: balance, bet…"
site_search_clear: "Clear the search"
site_search_empty: "Nothing matched. Try another word — the search looks at the command name, its description and its no-slash words."
